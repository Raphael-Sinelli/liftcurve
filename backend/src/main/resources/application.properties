quarkus.application.name=gym-progress-tracker-backend

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:gymtracker}
quarkus.datasource.password=${DB_PASSWORD:gymtracker}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gymtracker}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.jackson.property-naming-strategy=SNAKE_CASE

gymtracker.jwt.secret=${JWT_SECRET:Yb6-3fvO5B7NLqSuo9fJ4r_MmCS9rgwIegNlKXqJzgw}
gymtracker.jwt.access-token-ttl-minutes=15
gymtracker.jwt.refresh-token-ttl-days=30

mp.jwt.verify.issuer=gym-progress-tracker
# smallrye.jwt.verify.secretkey only resolves inline content via KeyLocationResolver,
# which supports PEM/JWK shapes only — never a raw ASCII passphrase (confirmed by
# decompiling smallrye-jwt 4.6.3). Wrapping the secret as an "oct" JWK here lets
# verification succeed with the exact same bytes TokenService signs with, since
# gymtracker.jwt.secret is now itself a base64url string (see TokenService.java).
smallrye.jwt.verify.secretkey={"kty":"oct","k":"${gymtracker.jwt.secret}"}
smallrye.jwt.verify.algorithm=HS256
# Without this, SmallryeJwtDevModeProcessor sees none of its 9 recognized
# "signing/verification key" properties configured (smallrye.jwt.verify.secretkey
# isn't one of them) and auto-generates an in-memory RSA key pair for dev/test
# mode, publishing it as mp.jwt.verify.publickey — which then silently wins over
# our HS256 secretkey (SmallRye logs SRJWT03007) and rejects every valid token.
# Declaring this property (any of the 9 works) short-circuits that auto-generation.
smallrye.jwt.sign.key=NONE

# Seed da conta demo pública (ver docs/superpowers/plans/2026-07-25-sprint4-api-polish-seed.md).
# Roda uma única vez no boot, idempotente por email — desligado por padrão, nunca liga sozinho
# em dev/test/CI. Em produção (Render), setar GYMTRACKER_SEED_DEMO=true uma vez.
gymtracker.seed.demo.enabled=${GYMTRACKER_SEED_DEMO:false}

quarkus.http.port=${PORT:8080}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# A app autentica só via Bearer token, nunca via cookies — então este header nunca
# deveria ser enviado. Mas o Quarkus 3.37.3, quando quarkus.http.cors.origins é uma
# lista concreta (não wildcard) e access-control-allow-credentials não é setado
# explicitamente, calcula o valor efetivo como "originMatched" (true para qualquer
# origem permitida) em vez de default para false — confirmado por decompilação do
# CORSFilter e por teste live com curl. Setar explicitamente evita o vazamento.
quarkus.http.cors.access-control-allow-credentials=false
